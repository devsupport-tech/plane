version: "3.8"

services:
  # Frontend - Web Application
  web:
    image: makeplane/plane-frontend:stable
    container_name: plane-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${API_BASE_URL:-http://localhost:8000}
      NEXT_PUBLIC_WEB_BASE_URL: ${WEB_URL:-http://localhost:3000}
      NEXT_PUBLIC_ADMIN_BASE_URL: ${ADMIN_BASE_URL:-http://localhost:3001}
      NEXT_PUBLIC_ADMIN_BASE_PATH: ${ADMIN_BASE_PATH:-/god-mode}
      NEXT_PUBLIC_SPACE_BASE_URL: ${SPACE_BASE_URL:-http://localhost:3002}
      NEXT_PUBLIC_SPACE_BASE_PATH: ${SPACE_BASE_PATH:-/spaces}
      NEXT_PUBLIC_LIVE_BASE_URL: ${LIVE_BASE_URL:-http://localhost:3100}
      NEXT_PUBLIC_LIVE_BASE_PATH: ${LIVE_BASE_PATH:-/live}
    depends_on:
      - api
    networks:
      - plane-network

  # Admin Panel
  admin:
    image: makeplane/plane-admin:stable
    container_name: plane-admin
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${API_BASE_URL:-http://localhost:8000}
      NEXT_PUBLIC_ADMIN_BASE_URL: ${ADMIN_BASE_URL:-http://localhost:3001}
      NEXT_PUBLIC_ADMIN_BASE_PATH: ${ADMIN_BASE_PATH:-/god-mode}
      NEXT_PUBLIC_WEB_BASE_URL: ${WEB_URL:-http://localhost:3000}
    depends_on:
      - api
      - web
    networks:
      - plane-network

  # Public Spaces
  space:
    image: makeplane/plane-space:stable
    container_name: plane-space
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${API_BASE_URL:-http://localhost:8000}
      NEXT_PUBLIC_SPACE_BASE_URL: ${SPACE_BASE_URL:-http://localhost:3002}
      NEXT_PUBLIC_SPACE_BASE_PATH: ${SPACE_BASE_PATH:-/spaces}
      NEXT_PUBLIC_WEB_BASE_URL: ${WEB_URL:-http://localhost:3000}
    depends_on:
      - api
      - web
    networks:
      - plane-network

  # Live Collaboration
  live:
    image: makeplane/plane-live:stable
    container_name: plane-live
    restart: unless-stopped
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://api:8000}
    depends_on:
      - api
      - web
    networks:
      - plane-network

  # API Backend
  api:
    image: makeplane/plane-backend:stable
    container_name: plane-api
    restart: unless-stopped
    command: ./bin/docker-entrypoint-api.sh
    volumes:
      - logs_api:/code/plane/logs
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-plane}:${POSTGRES_PASSWORD:-plane}@plane-db:5432/${POSTGRES_DB:-plane}
      
      # Redis
      REDIS_HOST: plane-redis
      REDIS_PORT: 6379
      REDIS_URL: redis://plane-redis:6379/
      
      # RabbitMQ
      RABBITMQ_HOST: plane-mq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-plane}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-plane}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-plane}
      
      # Storage
      USE_MINIO: ${USE_MINIO:-1}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-access-key}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-secret-key}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://plane-minio:9000}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
      
      # Application
      WEB_URL: ${WEB_URL:-http://localhost}
      DEBUG: ${DEBUG:-0}
      SECRET_KEY: ${SECRET_KEY:-60gp0byfz2dvffa45cxl20p1scy9xbpf6d8c5y0geejgkyp1b5}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      
      # URLs
      ADMIN_BASE_URL: ${ADMIN_BASE_URL:-http://localhost:3001}
      ADMIN_BASE_PATH: ${ADMIN_BASE_PATH:-/god-mode}
      SPACE_BASE_URL: ${SPACE_BASE_URL:-http://localhost:3002}
      SPACE_BASE_PATH: ${SPACE_BASE_PATH:-/spaces}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      APP_BASE_PATH: ${APP_BASE_PATH:-}
      LIVE_BASE_URL: ${LIVE_BASE_URL:-http://localhost:3100}
      LIVE_BASE_PATH: ${LIVE_BASE_PATH:-/live}
      
      # Security
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-60/minute}
    depends_on:
      - plane-db
      - plane-redis
      - plane-mq
    networks:
      - plane-network

  # Background Worker
  worker:
    image: makeplane/plane-backend:stable
    container_name: plane-worker
    restart: unless-stopped
    command: ./bin/docker-entrypoint-worker.sh
    volumes:
      - logs_worker:/code/plane/logs
    environment:
      # Same environment as API
      DATABASE_URL: postgresql://${POSTGRES_USER:-plane}:${POSTGRES_PASSWORD:-plane}@plane-db:5432/${POSTGRES_DB:-plane}
      REDIS_HOST: plane-redis
      REDIS_PORT: 6379
      REDIS_URL: redis://plane-redis:6379/
      RABBITMQ_HOST: plane-mq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-plane}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-plane}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-plane}
      USE_MINIO: ${USE_MINIO:-1}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-access-key}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-secret-key}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://plane-minio:9000}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
      WEB_URL: ${WEB_URL:-http://localhost}
      DEBUG: ${DEBUG:-0}
      SECRET_KEY: ${SECRET_KEY:-60gp0byfz2dvffa45cxl20p1scy9xbpf6d8c5y0geejgkyp1b5}
    depends_on:
      - api
      - plane-db
      - plane-redis
      - plane-mq
    networks:
      - plane-network

  # Celery Beat Scheduler
  beat-worker:
    image: makeplane/plane-backend:stable
    container_name: plane-beat
    restart: unless-stopped
    command: ./bin/docker-entrypoint-beat.sh
    volumes:
      - logs_beat:/code/plane/logs
    environment:
      # Same environment as API
      DATABASE_URL: postgresql://${POSTGRES_USER:-plane}:${POSTGRES_PASSWORD:-plane}@plane-db:5432/${POSTGRES_DB:-plane}
      REDIS_HOST: plane-redis
      REDIS_PORT: 6379
      REDIS_URL: redis://plane-redis:6379/
      RABBITMQ_HOST: plane-mq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-plane}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-plane}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-plane}
      USE_MINIO: ${USE_MINIO:-1}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-access-key}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-secret-key}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://plane-minio:9000}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
      WEB_URL: ${WEB_URL:-http://localhost}
      DEBUG: ${DEBUG:-0}
      SECRET_KEY: ${SECRET_KEY:-60gp0byfz2dvffa45cxl20p1scy9xbpf6d8c5y0geejgkyp1b5}
    depends_on:
      - api
      - plane-db
      - plane-redis
      - plane-mq
    networks:
      - plane-network

  # Database Migrator
  migrator:
    image: makeplane/plane-backend:stable
    container_name: plane-migrator
    restart: "no"
    command: ./bin/docker-entrypoint-migrator.sh
    volumes:
      - logs_migrator:/code/plane/logs
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-plane}:${POSTGRES_PASSWORD:-plane}@plane-db:5432/${POSTGRES_DB:-plane}
      REDIS_HOST: plane-redis
      REDIS_PORT: 6379
      REDIS_URL: redis://plane-redis:6379/
      USE_MINIO: ${USE_MINIO:-1}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-access-key}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-secret-key}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://plane-minio:9000}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
      SECRET_KEY: ${SECRET_KEY:-60gp0byfz2dvffa45cxl20p1scy9xbpf6d8c5y0geejgkyp1b5}
    depends_on:
      - plane-db
      - plane-redis
    networks:
      - plane-network

  # PostgreSQL Database
  plane-db:
    image: postgres:15.7-alpine
    container_name: plane-db
    restart: unless-stopped
    command: postgres -c 'max_connections=1000'
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plane}
      POSTGRES_DB: ${POSTGRES_DB:-plane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plane}
      PGDATA: /var/lib/postgresql/data
    networks:
      - plane-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plane}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  plane-redis:
    image: valkey/valkey:7.2.5-alpine
    container_name: plane-redis
    restart: unless-stopped
    volumes:
      - redisdata:/data
    networks:
      - plane-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ Message Queue
  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    container_name: plane-mq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-plane}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-plane}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-plane}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - plane-network

  # MinIO Object Storage (S3 compatible)
  plane-minio:
    image: minio/minio:latest
    container_name: plane-minio
    restart: unless-stopped
    command: server /export --console-address ":9090"
    volumes:
      - uploads:/export
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-access-key}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-secret-key}
    networks:
      - plane-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Nginx Proxy
  proxy:
    image: makeplane/plane-proxy:stable
    container_name: plane-proxy
    restart: unless-stopped
    ports:
      - "${LISTEN_HTTP_PORT:-80}:80"
      - "${LISTEN_HTTPS_PORT:-443}:443"
    environment:
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
      BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      # SSL Configuration
      SSL: ${SSL:-false}
      CERT_EMAIL: ${CERT_EMAIL:-}
      CERT_ACME_CA: ${CERT_ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
      CERT_ACME_DNS: ${CERT_ACME_DNS:-}
    volumes:
      - proxy_config:/config
      - proxy_data:/data
    depends_on:
      - web
      - api
      - space
      - admin
      - live
    networks:
      - plane-network

networks:
  plane-network:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  uploads:
  rabbitmq_data:
  logs_api:
  logs_worker:
  logs_beat:
  logs_migrator:
  proxy_config:
  proxy_data: